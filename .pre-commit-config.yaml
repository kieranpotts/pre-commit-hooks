#
# Pre-commit hooks configuration. This repository eats its own dog food,
# consuming the same hooks it shares with other repositories.
#
# See https://pre-commit.com for more information.
#
# Install the framework:
#   pip install pre-commit
#
# Install the git hook scripts:
#   pre-commit install
#
# Run against all files (useful after adding new hooks):
#   pre-commit run --all-files
#

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: validate-commit-message
        name: Validate commit message format
        entry: hooks/validate_commit_message.py
        language: script
        stages: [commit-msg]
